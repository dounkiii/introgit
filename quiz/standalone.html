<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1ef">
<title>あなたのこと、もう少し知りたい。</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23a8617b' stroke-width='3'/%3E%3C/svg%3E">
<style>
/* =========================================================
   基本トークン
   ========================================================= */
:root {
  --bg:        #f6f1ef;
  --bg-tint:   #efe6e3;
  --card:      #fffdfc;
  --line:      #e6dbd7;
  --line-soft: #f0e7e4;
  --ink:       #2f2a2c;
  --ink-mid:   #6b6165;
  --ink-soft:  #9a8f93;
  --accent:    #a8617b;
  --accent-sub:#c98fa4;
  --accent-bg: #f6e9ee;
  --shadow:    0 1px 2px rgba(70, 45, 55, .04), 0 10px 30px rgba(70, 45, 55, .06);
  --shadow-lift: 0 2px 4px rgba(70, 45, 55, .06), 0 16px 40px rgba(70, 45, 55, .10);
  --radius:    20px;
  --ease:      cubic-bezier(.22, .8, .26, 1);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #171416;
    --bg-tint:   #201b1f;
    --card:      #211d20;
    --line:      #342c31;
    --line-soft: #2a2429;
    --ink:       #f0e9ec;
    --ink-mid:   #b6a9af;
    --ink-soft:  #857a80;
    --accent:    #e0a0b7;
    --accent-sub:#c98fa4;
    --accent-bg: #33242c;
    --shadow:    0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .28);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .35), 0 16px 40px rgba(0, 0, 0, .4);
  }
}

* { box-sizing: border-box; }

/* display を持つクラスに hidden 属性が付いても確実に隠す */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
}

body {
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
               -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  letter-spacing: .02em;
}

/* うっすらとした背景の色みだけ添える */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(60% 40% at 15% 0%,  var(--accent-bg), transparent 70%),
    radial-gradient(50% 35% at 95% 100%, var(--bg-tint), transparent 70%);
  opacity: .85;
  pointer-events: none;
}

.app {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding:
    calc(env(safe-area-inset-top) + 20px)
    20px
    calc(env(safe-area-inset-bottom) + 40px);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* =========================================================
   画面切り替え
   ========================================================= */
.screen { display: none; flex: 1 1 auto; flex-direction: column; }
.screen.is-active { display: flex; animation: screen-in .42s var(--ease) both; }

@keyframes screen-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

/* =========================================================
   ボタン共通
   ========================================================= */
.btn {
  appearance: none;
  border: 0;
  font: inherit;
  font-size: 16px;
  letter-spacing: .04em;
  cursor: pointer;
  border-radius: 999px;
  padding: 16px 24px;
  width: 100%;
  transition: transform .18s var(--ease), background-color .2s var(--ease),
              box-shadow .25s var(--ease), color .2s var(--ease);
}
.btn:active { transform: scale(.98); }

.btn--primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 8px 22px rgba(168, 97, 123, .28);
}
@media (prefers-color-scheme: dark) {
  .btn--primary { color: #241a1f; box-shadow: 0 8px 22px rgba(0, 0, 0, .45); }
}

.btn--ghost {
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}

.btn--text {
  background: none;
  color: var(--ink-soft);
  font-size: 14px;
  padding: 10px 12px;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-color: var(--line);
}
.btn--text:hover { color: var(--ink-mid); }

.btn--skip {
  background: var(--card);
  color: var(--ink-mid);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}

/* =========================================================
   トップ画面
   ========================================================= */
.screen--start { justify-content: center; }

.start__inner { text-align: center; padding: 32px 4px; }

/* ふたつ並んだ丸（トップと完了画面の小さな飾り） */
.mark {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  color: var(--accent-sub);
}
.mark i {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
}
.mark i:first-child { background: currentColor; }

.start__mark {
  margin: 0 0 30px;
  animation: breathe 4.5s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { opacity: .55; transform: translateY(0); }
  50%      { opacity: 1;   transform: translateY(-3px); }
}

.start__title {
  margin: 0 0 18px;
  font-size: 27px;
  line-height: 1.65;
  font-weight: 600;
  letter-spacing: .04em;
}

.start__lead {
  margin: 0 0 44px;
  color: var(--ink-mid);
  font-size: 15px;
}

.start__actions { display: grid; gap: 14px; }

.resume {
  margin-top: 14px;
  padding: 20px 18px 12px;
  background: var(--card);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: grid;
  gap: 10px;
}
.resume__text { margin: 0 0 4px; font-size: 14px; color: var(--ink-mid); }

.start__note {
  margin: 40px 0 0;
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing: .06em;
}

/* =========================================================
   上部バー・進捗
   ========================================================= */
.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 4px 0 22px;
}

.iconbtn {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line-soft);
  background: var(--card);
  color: var(--ink-mid);
  cursor: pointer;
  transition: opacity .2s var(--ease), transform .18s var(--ease);
}
.iconbtn:active { transform: scale(.94); }
.iconbtn[disabled] { opacity: .3; cursor: default; }
.iconbtn svg {
  width: 20px; height: 20px;
  fill: none; stroke: currentColor;
  stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
}

.progress { flex: 1 1 auto; display: flex; align-items: center; gap: 12px; }

.progress__bar {
  flex: 1 1 auto;
  height: 3px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}
.progress__fill {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent-sub), var(--accent));
  transition: width .5s var(--ease);
}
.progress__count {
  margin: 0;
  flex: 0 0 auto;
  font-size: 12px;
  letter-spacing: .12em;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

/* =========================================================
   設問
   ========================================================= */
.qwrap { flex: 1 1 auto; display: flex; flex-direction: column; }
.qwrap.is-swapping { animation: q-out .16s var(--ease) both; }
.qwrap.is-entering { animation: q-in .42s var(--ease) both; }

@keyframes q-out { to { opacity: 0; transform: translateY(-6px); } }
@keyframes q-in  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.milestone {
  margin: 0 0 18px;
  align-self: flex-start;
  font-size: 12.5px;
  letter-spacing: .08em;
  color: var(--accent);
  background: var(--accent-bg);
  border-radius: 999px;
  padding: 6px 16px;
  animation: pop-in .5s var(--ease) both;
}
.milestone--static { color: var(--ink-mid); background: var(--bg-tint); }
@keyframes pop-in {
  from { opacity: 0; transform: translateY(6px) scale(.96); }
  to   { opacity: 1; transform: none; }
}

.qtext { margin: 4px 0 26px; }

.qtext__scene {
  margin: 0 0 14px;
  color: var(--ink-mid);
  font-size: 15px;
  line-height: 1.95;
}
.qtext__scene p { margin: 0; }

.qtext__ask {
  margin: 0;
  font-size: 21px;
  line-height: 1.7;
  font-weight: 600;
  letter-spacing: .03em;
}

.qtext__note { margin: 14px 0 0; font-size: 13px; color: var(--ink-soft); }

/* 選択肢カード */
.options { display: grid; gap: 10px; }

.option {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  font: inherit;
  font-size: 15.5px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line-soft);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 15px 18px;
  cursor: pointer;
  transition: transform .2s var(--ease), border-color .25s var(--ease),
              background-color .25s var(--ease), box-shadow .25s var(--ease);
  animation: card-in .45s var(--ease) both;
  animation-delay: calc(var(--i) * 45ms);
}
.option:active { transform: scale(.985); }
@media (hover: hover) {
  .option:hover { border-color: var(--accent-sub); box-shadow: var(--shadow-lift); }
}

@keyframes card-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.option__dot {
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  transition: border-color .25s var(--ease), background-color .25s var(--ease),
              box-shadow .25s var(--ease);
}

.option.is-current { border-color: var(--accent-sub); background: var(--accent-bg); }
.option.is-current .option__dot { border-color: var(--accent); background: var(--accent); }

.option.is-picked {
  border-color: var(--accent);
  background: var(--accent-bg);
  animation: pick .42s var(--ease);
}
.option.is-picked .option__dot {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: 0 0 0 5px var(--accent-bg);
}
@keyframes pick {
  0%   { transform: scale(1); }
  35%  { transform: scale(.975); }
  100% { transform: scale(1); }
}

/* =========================================================
   自由記述
   ========================================================= */
.freetext {
  width: 100%;
  font: inherit;
  font-size: 16px;
  line-height: 1.8;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line-soft);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 18px;
  resize: vertical;
  outline: none;
  transition: border-color .25s var(--ease);
}
.freetext:focus { border-color: var(--accent-sub); }

.free__actions { display: grid; gap: 12px; margin-top: 26px; }

/* =========================================================
   完了画面
   ========================================================= */
.screen--done { justify-content: center; }
.done__inner { text-align: center; padding: 24px 0; }

.done__mark { margin: 0 0 26px; }
.done__title { margin: 0 0 14px; font-size: 25px; line-height: 1.6; font-weight: 600; }
.done__lead  { margin: 0 0 38px; color: var(--ink-mid); font-size: 15px; }

.done__actions { display: grid; gap: 12px; }
.done__row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.done__row .btn { padding: 15px 10px; font-size: 15px; }

.preview {
  margin-top: 34px;
  text-align: left;
  border-top: 1px solid var(--line-soft);
  padding-top: 18px;
}
.preview summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-soft);
  list-style: none;
  letter-spacing: .06em;
}
.preview summary::-webkit-details-marker { display: none; }
.preview summary::before { content: "＋ "; }
.preview[open] summary::before { content: "− "; }

.preview pre {
  margin: 16px 0 0;
  padding: 18px;
  background: var(--card);
  border: 1px solid var(--line-soft);
  border-radius: 16px;
  font-size: 12.5px;
  line-height: 1.9;
  color: var(--ink-mid);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 320px;
  overflow: auto;
  font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
}

/* =========================================================
   トースト
   ========================================================= */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom) + 28px);
  transform: translate(-50%, 14px);
  margin: 0;
  padding: 12px 22px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--bg);
  font-size: 13.5px;
  letter-spacing: .04em;
  box-shadow: var(--shadow-lift);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s var(--ease), transform .3s var(--ease);
  z-index: 20;
}
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

/* =========================================================
   その他
   ========================================================= */
@media (min-width: 520px) {
  .start__title { font-size: 30px; }
  .qtext__ask   { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>

<main class="app">

  <!-- ================= トップ ================= -->
  <section class="screen screen--start is-active" id="screen-start">
    <div class="start__inner">
      <p class="mark start__mark" aria-hidden="true"><i></i><i></i></p>
      <h1 class="start__title">あなたのこと、<br>もう少し知りたい。</h1>
      <p class="start__lead">15問・約2分。直感で選んでね。</p>

      <div class="start__actions">
        <button class="btn btn--primary" id="btn-start" type="button">はじめる</button>

        <div class="resume" id="resume-box" hidden>
          <p class="resume__text" id="resume-text">前回の続きがあります。</p>
          <button class="btn btn--ghost" id="btn-resume" type="button">続きから</button>
          <button class="btn btn--text" id="btn-restart-start" type="button">最初からやり直す</button>
        </div>
      </div>

      <p class="start__note">回答はこの端末の中だけに保存されます。</p>
    </div>
  </section>

  <!-- ================= 設問 ================= -->
  <section class="screen screen--quiz" id="screen-quiz">
    <header class="topbar">
      <button class="iconbtn" id="btn-back" type="button" aria-label="前の質問へ戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <div class="progress">
        <div class="progress__bar"><span class="progress__fill" id="progress-fill"></span></div>
        <p class="progress__count" id="progress-count">1 / 15</p>
      </div>
    </header>

    <div class="qwrap" id="qwrap">
      <p class="milestone" id="milestone" hidden></p>
      <div class="qtext">
        <div class="qtext__scene" id="q-scene"></div>
        <h2 class="qtext__ask" id="q-ask"></h2>
      </div>
      <div class="options" id="options"></div>
    </div>
  </section>

  <!-- ================= 任意の自由記述 ================= -->
  <section class="screen screen--free" id="screen-free">
    <header class="topbar">
      <button class="iconbtn" id="btn-back-free" type="button" aria-label="前の質問へ戻る">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <div class="progress">
        <div class="progress__bar"><span class="progress__fill" style="width:100%"></span></div>
        <p class="progress__count">15 / 15</p>
      </div>
    </header>

    <div class="qwrap">
      <p class="milestone milestone--static" id="free-lead"></p>
      <div class="qtext">
        <h2 class="qtext__ask" id="free-ask"></h2>
        <p class="qtext__note" id="free-note"></p>
      </div>
      <textarea class="freetext" id="freetext" rows="5"></textarea>
      <div class="free__actions">
        <button class="btn btn--primary" id="btn-free-done" type="button">これで完了</button>
        <button class="btn btn--skip" id="btn-skip" type="button">スキップ</button>
      </div>
    </div>
  </section>

  <!-- ================= 完了 ================= -->
  <section class="screen screen--done" id="screen-done">
    <div class="done__inner">
      <p class="mark done__mark" aria-hidden="true"><i></i><i></i></p>
      <h2 class="done__title">ありがとう。<br>おつかれさま。</h2>
      <p class="done__lead">15問、ぜんぶ答えてくれました。</p>

      <div class="done__actions">
        <button class="btn btn--primary" id="btn-copy" type="button">回答をコピー</button>
        <div class="done__row">
          <button class="btn btn--ghost" id="btn-copy-json" type="button">JSONをコピー</button>
          <button class="btn btn--ghost" id="btn-save-txt" type="button">TXTで保存</button>
        </div>
        <button class="btn btn--text" id="btn-review" type="button">回答を見直す</button>
        <button class="btn btn--text" id="btn-restart-done" type="button">最初からやり直す</button>
      </div>

      <details class="preview">
        <summary>コピーされる内容を見る</summary>
        <pre id="preview-text"></pre>
      </details>
    </div>
  </section>

</main>

<p class="toast" id="toast" role="status" aria-live="polite"></p>

<script>
/**
 * 質問データ。
 *
 * ここだけを書き換えれば、質問文・選択肢・順番を変更できます。
 * - id      : 表示・出力に使う識別子（Q1 など）
 * - scene   : 状況説明。配列の1要素が1行として表示される（無い場合は空配列）
 * - ask     : 実際に問いかける一文
 * - options : 選択肢（順番はそのまま表示される）
 *
 * コピー用テキストの見出しは scene と ask を連結して自動生成されます。
 *   例) 【Q2 ちょっと嫌なことがあった日に恋人と会いました。一番嬉しいのは？】
 */
const QUESTIONS = [
  {
    id: 'Q1',
    scene: ['友達との旅行。'],
    ask: '予定を決めるなら一番近いのは？',
    options: [
      '行く場所や時間まである程度決めておきたい',
      'メインだけ決めて、あとはその場で',
      '候補だけいくつか用意しておく',
      '当日の気分で決めるのが好き'
    ]
  },
  {
    id: 'Q2',
    scene: ['ちょっと嫌なことがあった日に恋人と会いました。'],
    ask: '一番嬉しいのは？',
    options: [
      '「なんかあった？」と気づいてくれる',
      '自分から話したらじっくり聞いてくれる',
      '美味しいものや楽しいことで気分転換してくれる',
      '特に触れず、いつも通り接してくれる'
    ]
  },
  {
    id: 'Q3',
    scene: ['何気なく「これちょっと欲しいかも」と話したものを、数か月後に恋人が覚えていました。'],
    ask: 'どう感じる？',
    options: [
      'めちゃくちゃ嬉しい',
      '結構嬉しい',
      '嬉しいけど、そこまで重要ではない',
      'あまり何とも思わない'
    ]
  },
  {
    id: 'Q4',
    scene: [
      '楽しみにしていたデートの日。',
      '恋人から突然、',
      '「ごめん、今日予定変えてもいい？」',
      'と言われました。'
    ],
    ask: '最初に感じるものに一番近いのは？',
    options: [
      '理由が気になる',
      'ちょっと残念・悲しい',
      '仕方ないと思う',
      '新しい予定も楽しそうなら全然OK',
      '自分との予定を大事にしてほしかったと思う'
    ]
  },
  {
    id: 'Q5',
    scene: ['恋人と意見が完全に食い違いました。'],
    ask: '自分に一番近いのは？',
    options: [
      '納得できるまで話したい',
      'お互いの考えを聞いて落とし所を探したい',
      '一旦時間を置いてから話したい',
      '大きな問題じゃなければ自分が折れてもいい',
      '喧嘩になるくらいなら流したい'
    ]
  },
  {
    id: 'Q6',
    scene: [
      '自分が落ち込んでいる時に恋人から、',
      '「じゃあこうすれば解決できるんじゃない？」',
      'と言われました。'
    ],
    ask: '一番近い感覚は？',
    options: [
      '解決策を考えてくれるのは嬉しい',
      'まず気持ちを分かってから言ってほしい',
      '正しいことを言われても今は違うと思う',
      '内容による',
      '自分で解決したいのであまり介入してほしくない'
    ]
  },

    options: [

  },
  {

    ask: '一番近いのは？',
    options: [

      '少し気になるけど特に連絡はしない',
      '何してるかなとは結構気になる',
      '一言くらい連絡があると嬉しい',
      '誰といるかによってかなり変わる'
    ]
  },
  {
    id: 'Q9',
    scene: ['恋人があなたの髪型や服の小さな変化に気づきませんでした。'],
    ask: 'どう感じる？',
    options: [
      '全然気にならない',

  },
  {

    scene: [],
    ask: '恋人から褒められるなら、どれが一番嬉しい？',

  },
  {

    scene: ['ちょっと空気が悪くなった時、恋人が笑わせようとしてきました。'],
    ask: '一番近いのは？',
    options: [
      '割とすぐ笑って許してしまう',
      '面白ければちょっと機嫌が直る',
      'まずちゃんと話してからにしてほしい',
      '今ふざけるところじゃないと思う',
      '原因による'
    ]
  },
  {
    id: 'Q12',
    scene: ['恋人が異性の友達と二人で食事に行くことになりました。'],
    ask: '一番近い感覚は？',
    options: [
      '特に気にならない',

      '相手が誰なのかは気になる',

    ]
  },
  {
    id: 'Q13',
    scene: ['忙しい一週間。'],
    ask: '恋人とあまり会えないとしたら、どれが一番嬉しい？',
    options: [
      '短時間でも会う',
      '電話する',
      'LINEなどでこまめに話す',
      '「落ち着いたら会おう」と予定だけ決める',
      '忙しい時はお互い自分のことに集中する'
    ]
  },
  {
    id: 'Q14',
    scene: [],
    ask: '誕生日に恋人が何かしてくれるなら？',
    options: [
      '自分が欲しいと言っていたものを覚えていてくれる',
      '相手が自分で一生懸命考えてくれる',
      'サプライズしてくれる',
      '一緒にどこかへ行って思い出を作る',
      '特別なことより、一緒にゆっくり過ごしたい'
    ]
  },
  {
    id: 'Q15',
    scene: [],
    ask: '恋人との関係で、一番「幸せだな」と感じそうなのは？',
    options: [
      '何でも話せて理解し合えている',
      '一緒にたくさん笑っている',
      '大切にされていると実感できる',
      'お互いを信頼して自由でいられる',
      '困った時に支え合える',
      '一緒にいるだけで安心できる'
    ]
  }
];

/** 最後の任意質問（自由記述）。 */
const OPTIONAL_QUESTION = {
  lead: '最後にひとつだけ。',
  ask: '自分の性格で「ここ、ちょっと面倒かも（笑）」と思うところがあれば教えて。',
  placeholder: '思いつかなければ、そのまま次へ進んでOK。',
  note: '書いても書かなくても大丈夫です。'
};

/** 途中で挟む一言（キーは「何問目か」= 1始まり）。 */
const MILESTONES = {
  5: 'いい感じ。あと10問。',
  10: 'あと5問。'
};
</script>
<script>
/* =========================================================
   状態管理
   - 回答は localStorage にだけ保存する（外部送信はしない）
   - アプリ側では回答の判定・分類・ラベル付けは一切行わない
   ========================================================= */

const STORAGE_KEY = 'love-quiz.state.v3';
const SCHEMA_VERSION = 3;

/* 旧バージョンの保存データ（50問版 / 旧15問版）は読み込まずに破棄する */
const LEGACY_KEYS = [
  'love-quiz.state',
  'love-quiz.state.v1',
  'love-quiz.state.v2',
  'personality-quiz-state',
  'quizAnswers'
];

const AUTO_ADVANCE_MS = 420;

function emptyState() {
  return {
    v: SCHEMA_VERSION,
    answers: new Array(QUESTIONS.length).fill(null), // 各要素は選択肢のindex
    free: '',
    index: 0,
    completed: false,
    startedAt: null,
    updatedAt: null
  };
}

let state = emptyState();

function loadState() {
  try {
    LEGACY_KEYS.forEach(function (k) { localStorage.removeItem(k); });
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.v !== SCHEMA_VERSION) {
      localStorage.removeItem(STORAGE_KEY);
      return null;
    }
    if (!Array.isArray(parsed.answers) || parsed.answers.length !== QUESTIONS.length) {
      localStorage.removeItem(STORAGE_KEY);
      return null;
    }
    // 選択肢の数が変わっている場合は、その設問だけ無効にする
    parsed.answers = parsed.answers.map(function (a, i) {
      return (Number.isInteger(a) && a >= 0 && a < QUESTIONS[i].options.length) ? a : null;
    });
    parsed.free = typeof parsed.free === 'string' ? parsed.free : '';
    parsed.index = clamp(parsed.index || 0, 0, QUESTIONS.length - 1);
    parsed.completed = !!parsed.completed;
    return parsed;
  } catch (e) {
    return null;
  }
}

function saveState() {
  state.updatedAt = new Date().toISOString();
  if (!state.startedAt) state.startedAt = state.updatedAt;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    /* 保存できない環境でも回答自体は続けられるようにする */
  }
}

function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* noop */ }
}

function clamp(n, min, max) { return Math.min(Math.max(n, min), max); }

function answeredCount() {
  return state.answers.filter(function (a) { return a !== null; }).length;
}

/* =========================================================
   要素参照
   ========================================================= */
const el = {
  screens: {
    start: document.getElementById('screen-start'),
    quiz:  document.getElementById('screen-quiz'),
    free:  document.getElementById('screen-free'),
    done:  document.getElementById('screen-done')
  },
  resumeBox:   document.getElementById('resume-box'),
  resumeText:  document.getElementById('resume-text'),
  qwrap:       document.getElementById('qwrap'),
  milestone:   document.getElementById('milestone'),
  scene:       document.getElementById('q-scene'),
  ask:         document.getElementById('q-ask'),
  options:     document.getElementById('options'),
  back:        document.getElementById('btn-back'),
  fill:        document.getElementById('progress-fill'),
  count:       document.getElementById('progress-count'),
  freeLead:    document.getElementById('free-lead'),
  freeAsk:     document.getElementById('free-ask'),
  freeNote:    document.getElementById('free-note'),
  freetext:    document.getElementById('freetext'),
  preview:     document.getElementById('preview-text'),
  toast:       document.getElementById('toast')
};

/* =========================================================
   画面遷移
   ========================================================= */
let current = 'start';

function show(name) {
  current = name;
  Object.keys(el.screens).forEach(function (key) {
    el.screens[key].classList.toggle('is-active', key === name);
  });
  window.scrollTo({ top: 0, behavior: 'auto' });
}

/* =========================================================
   設問の描画
   ========================================================= */
let locked = false; // 自動送りの最中の二重タップ防止

function questionLabel(q) {
  return q.scene.join('') + q.ask;
}

function renderQuestion(animate) {
  const i = state.index;
  const q = QUESTIONS[i];

  // 進捗
  el.count.textContent = (i + 1) + ' / ' + QUESTIONS.length;
  el.fill.style.width = (((i + 1) / QUESTIONS.length) * 100) + '%';

  // 途中の一言
  const milestone = MILESTONES[i + 1];
  if (milestone) {
    el.milestone.textContent = milestone;
    el.milestone.hidden = false;
  } else {
    el.milestone.hidden = true;
  }

  // 質問文
  el.scene.innerHTML = '';
  q.scene.forEach(function (line) {
    const p = document.createElement('p');
    p.textContent = line;
    el.scene.appendChild(p);
  });
  el.scene.hidden = q.scene.length === 0;
  el.ask.textContent = q.ask;

  // 選択肢
  el.options.innerHTML = '';
  q.options.forEach(function (text, idx) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option';
    btn.style.setProperty('--i', String(idx));
    if (state.answers[i] === idx) btn.classList.add('is-current');

    const dot = document.createElement('span');
    dot.className = 'option__dot';
    const label = document.createElement('span');
    label.className = 'option__label';
    label.textContent = text;

    btn.appendChild(dot);
    btn.appendChild(label);
    btn.addEventListener('click', function () { pick(idx, btn); });
    el.options.appendChild(btn);
  });

  if (animate) {
    el.qwrap.classList.remove('is-entering');
    void el.qwrap.offsetWidth;
    el.qwrap.classList.add('is-entering');
  }

  // 長い設問を下までスクロールして答えた後も、次の設問は先頭から始める
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function pick(optionIndex, btn) {
  if (locked) return;
  locked = true;

  state.answers[state.index] = optionIndex;
  saveState();

  Array.prototype.forEach.call(el.options.children, function (child) {
    child.classList.remove('is-current', 'is-picked');
  });
  btn.classList.add('is-picked');

  setTimeout(function () {
    locked = false;
    goNext();
  }, AUTO_ADVANCE_MS);
}

function goNext() {
  if (state.index < QUESTIONS.length - 1) {
    state.index += 1;
    saveState();
    swapQuestion();
  } else {
    openFree();
  }
}

function goPrev() {
  if (state.index > 0) {
    state.index -= 1;
    saveState();
    swapQuestion();
  } else {
    show('start');
    refreshStart();
  }
}

function swapQuestion() {
  el.qwrap.classList.add('is-swapping');
  setTimeout(function () {
    el.qwrap.classList.remove('is-swapping');
    renderQuestion(true);
  }, 150);
}

function openQuestion(index) {
  state.index = clamp(index, 0, QUESTIONS.length - 1);
  saveState();
  show('quiz');
  renderQuestion(true);
}

/* =========================================================
   最後の任意質問
   ========================================================= */
function openFree() {
  el.freeLead.textContent = OPTIONAL_QUESTION.lead;
  el.freeAsk.textContent = OPTIONAL_QUESTION.ask;
  el.freeNote.textContent = OPTIONAL_QUESTION.note;
  el.freetext.placeholder = OPTIONAL_QUESTION.placeholder;
  el.freetext.value = state.free;
  show('free');
}

function finish(keepFree) {
  state.free = keepFree ? el.freetext.value.trim() : '';
  state.completed = true;
  saveState();
  el.preview.textContent = buildText();
  show('done');
}

/* =========================================================
   出力（コピー用テキスト / JSON / TXT）
   ========================================================= */
function answerTextOf(i) {
  const a = state.answers[i];
  return a === null ? '（未回答）' : QUESTIONS[i].options[a];
}

function buildText() {
  const blocks = QUESTIONS.map(function (q, i) {
    return '【' + q.id + ' ' + questionLabel(q) + '】\n' + answerTextOf(i);
  });
  blocks.push('【任意】\n' + (state.free ? state.free : '（未記入）'));
  return blocks.join('\n\n') + '\n';
}

function buildJson() {
  return JSON.stringify({
    version: SCHEMA_VERSION,
    answeredAt: state.updatedAt || new Date().toISOString(),
    answers: QUESTIONS.map(function (q, i) {
      return {
        id: q.id,
        question: questionLabel(q),
        options: q.options,
        selectedIndex: state.answers[i],
        selected: state.answers[i] === null ? null : q.options[state.answers[i]]
      };
    }),
    optional: {
      question: OPTIONAL_QUESTION.ask,
      answer: state.free || null
    }
  }, null, 2);
}

function timestampForFile() {
  const d = new Date();
  const p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}

function copyToClipboard(text, message) {
  const done = function () { toast(message); };
  const fallback = function () {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? message : 'コピーできませんでした。下の内容を長押しで選択してね。');
  };

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

function saveTxtViaLink(text, filename) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  toast('TXTを保存しました');
}

function saveTxt() {
  const text = buildText();
  const filename = 'answers-' + timestampForFile() + '.txt';

  // ダウンロードが直接できない環境（埋め込み表示など）では、
  // 用意されている保存APIがあればそちらを使う
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(function (downloads) {
      if (!downloads) { saveTxtViaLink(text, filename); return; }
      downloads.save({ filename: filename, data: text }).then(function () {
        toast('TXTを保存しました');
      }).catch(function (err) {
        toast(err && err.code === 'declined' ? '保存をやめました' : 'TXTを保存できませんでした');
      });
    }).catch(function () { saveTxtViaLink(text, filename); });
    return;
  }

  saveTxtViaLink(text, filename);
}

let toastTimer = null;
function toast(message) {
  el.toast.textContent = message;
  el.toast.classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    el.toast.classList.remove('is-visible');
  }, 2200);
}

/* =========================================================
   トップ画面（続きから / やり直す）
   ========================================================= */
function refreshStart() {
  const saved = answeredCount() > 0 || state.free || state.completed;
  el.resumeBox.hidden = !saved;
  if (!saved) return;

  if (state.completed) {
    el.resumeText.textContent = '前回の回答が残っています。';
  } else {
    el.resumeText.textContent = '前回の続きがあります（' + answeredCount() + ' / ' + QUESTIONS.length + ' 問まで回答済み）。';
  }
}

function restart() {
  state = emptyState();
  clearState();
  el.freetext.value = '';
  refreshStart();
  show('start');
  toast('最初からになりました');
}

function resume() {
  if (state.completed) {
    el.preview.textContent = buildText();
    show('done');
    return;
  }
  // 未回答の最初の設問から再開する
  const next = state.answers.findIndex(function (a) { return a === null; });
  openQuestion(next === -1 ? QUESTIONS.length - 1 : next);
}

/* =========================================================
   イベント
   ========================================================= */
document.getElementById('btn-start').addEventListener('click', function () {
  if (answeredCount() > 0 || state.free || state.completed) {
    state = emptyState();
    clearState();
    el.freetext.value = '';
  }
  openQuestion(0);
});

document.getElementById('btn-resume').addEventListener('click', resume);
document.getElementById('btn-restart-start').addEventListener('click', restart);
document.getElementById('btn-restart-done').addEventListener('click', restart);

el.back.addEventListener('click', goPrev);
document.getElementById('btn-back-free').addEventListener('click', function () {
  state.free = el.freetext.value.trim();
  saveState();
  openQuestion(QUESTIONS.length - 1);
});

document.getElementById('btn-free-done').addEventListener('click', function () { finish(true); });
document.getElementById('btn-skip').addEventListener('click', function () { finish(false); });

el.freetext.addEventListener('input', function () {
  state.free = el.freetext.value;
  saveState();
});

document.getElementById('btn-copy').addEventListener('click', function () {
  copyToClipboard(buildText(), '回答をコピーしました');
});
document.getElementById('btn-copy-json').addEventListener('click', function () {
  copyToClipboard(buildJson(), 'JSONをコピーしました');
});
document.getElementById('btn-save-txt').addEventListener('click', saveTxt);
document.getElementById('btn-review').addEventListener('click', function () {
  openQuestion(QUESTIONS.length - 1);
});

/* =========================================================
   起動
   ========================================================= */
(function init() {
  const saved = loadState();
  if (saved) state = saved;
  el.freetext.value = state.free || '';
  refreshStart();
  show('start');
})();
</script>
